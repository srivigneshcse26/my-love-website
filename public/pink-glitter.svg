<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="pinkBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#ff75c3" />
      <stop offset="35%" stop-color="#ff2a8d" />
      <stop offset="70%" stop-color="#d6006e" />
      <stop offset="100%" stop-color="#800040" />
    </radialGradient>

    <!-- Glitter Sparkle Defs -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="sparkle">
      <path d="M 0,-12 Q 0,0 12,0 Q 0,0 0,12 Q 0,0 -12,0 Q 0,0 0,-12 Z" fill="#ffffff" opacity="0.9" />
      <circle cx="0" cy="0" r="3" fill="#ffe6f2" filter="url(#glow)" />
    </g>

    <g id="sparkle-small">
      <path d="M 0,-6 Q 0,0 6,0 Q 0,0 0,6 Q 0,0 -6,0 Q 0,0 0,-6 Z" fill="#ffffff" opacity="0.8" />
    </g>
  </defs>

  <!-- Base Pink Background -->
  <rect width="1920" height="1080" fill="url(#pinkBg)" />

  <!-- Shimmering Bokeh Orbs -->
  <g opacity="0.35">
    <circle cx="200" cy="150" r="180" fill="#ffb3da" filter="url(#glow)" />
    <circle cx="1600" cy="250" r="220" fill="#ff66b2" filter="url(#glow)" />
    <circle cx="950" cy="540" r="280" fill="#ff99ce" filter="url(#glow)" />
    <circle cx="400" cy="850" r="200" fill="#ff3399" filter="url(#glow)" />
    <circle cx="1450" cy="880" r="190" fill="#ff80bf" filter="url(#glow)" />
  </g>

  <!-- Densely Packed Pink Glitter Particles -->
  <g opacity="0.75">
    <!-- Row 1 -->
    <use href="#sparkle" x="120" y="80" transform="scale(1.2)" />
    <use href="#sparkle-small" x="250" y="190" />
    <use href="#sparkle" x="480" y="110" transform="scale(0.8)" />
    <use href="#sparkle-small" x="710" y="240" />
    <use href="#sparkle" x="890" y="90" transform="scale(1.4)" />
    <use href="#sparkle-small" x="1100" y="180" />
    <use href="#sparkle" x="1340" y="130" transform="scale(0.9)" />
    <use href="#sparkle-small" x="1560" y="70" />
    <use href="#sparkle" x="1780" y="210" transform="scale(1.1)" />

    <!-- Row 2 -->
    <use href="#sparkle-small" x="90" y="380" />
    <use href="#sparkle" x="310" y="420" transform="scale(1.3)" />
    <use href="#sparkle-small" x="550" y="340" />
    <use href="#sparkle" x="780" y="460" transform="scale(0.7)" />
    <use href="#sparkle-small" x="1020" y="390" />
    <use href="#sparkle" x="1250" y="430" transform="scale(1.5)" />
    <use href="#sparkle-small" x="1480" y="360" />
    <use href="#sparkle" x="1690" y="490" transform="scale(0.9)" />

    <!-- Row 3 -->
    <use href="#sparkle" x="180" y="650" transform="scale(0.9)" />
    <use href="#sparkle-small" x="410" y="720" />
    <use href="#sparkle" x="640" y="610" transform="scale(1.1)" />
    <use href="#sparkle-small" x="850" y="690" />
    <use href="#sparkle" x="1080" y="640" transform="scale(1.4)" />
    <use href="#sparkle-small" x="1310" y="710" />
    <use href="#sparkle" x="1530" y="620" transform="scale(0.8)" />
    <use href="#sparkle-small" x="1750" y="680" />

    <!-- Row 4 -->
    <use href="#sparkle-small" x="80" y="920" />
    <use href="#sparkle" x="290" y="870" transform="scale(1.2)" />
    <use href="#sparkle-small" x="510" y="960" />
    <use href="#sparkle" x="730" y="890" transform="scale(0.8)" />
    <use href="#sparkle-small" x="970" y="940" />
    <use href="#sparkle" x="1190" y="880" transform="scale(1.3)" />
    <use href="#sparkle-small" x="1410" y="980" />
    <use href="#sparkle" x="1640" y="910" transform="scale(1.0)" />
  </g>

  <!-- Fine Glitter Dust Circles -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="150" cy="220" r="2" /><circle cx="340" cy="150" r="3" /><circle cx="590" cy="280" r="1.5" />
    <circle cx="820" cy="170" r="2.5" /><circle cx="1040" cy="260" r="3" /><circle cx="1280" cy="110" r="2" />
    <circle cx="1490" cy="230" r="1.5" /><circle cx="1710" cy="140" r="3" /><circle cx="220" cy="510" r="2" />
    <circle cx="430" cy="480" r="1.5" /><circle cx="670" cy="550" r="3" /><circle cx="910" cy="440" r="2" />
    <circle cx="1140" cy="520" r="2.5" /><circle cx="1380" cy="470" r="1.5" /><circle cx="1600" cy="560" r="3" />
    <circle cx="1820" cy="430" r="2" /><circle cx="260" cy="810" r="3" /><circle cx="490" cy="780" r="2" />
    <circle cx="720" cy="840" r="1.5" /><circle cx="940" cy="790" r="2.5" /><circle cx="1170" cy="830" r="3" />
    <circle cx="1390" cy="770" r="2" /><circle cx="1620" cy="850" r="1.5" /><circle cx="1840" cy="790" r="2.5" />
  </g>
</svg>
